name: AI Trend Hunter

on:
  schedule:
    - cron: '0 */4 * * *' # Har 4 ghante baad automation chalegi
  workflow_dispatch:      # Aap manually bhi button daba kar run kar sakte hain

jobs:
  update-trends:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5 # v5 latest version hai
        with:
          python-version: '3.10'
          cache: 'pip' # Dependency caching se workflow fast ho jayega

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          # CRITICAL: Yahan pytrends add kar diya gaya hai
          pip install requests firebase-admin pytrends

      - name: Run Trend Script
        env:
          # Secrets ko script ke liye environment variables mein map karna
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python trend_hunter.py

      - name: Logging Status
        run: echo "Trend update cycle completed successfully at $(date)"
