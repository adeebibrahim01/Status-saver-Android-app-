plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.mariaxcodexpert.whatsdownloadplus'
    compileSdk 35

    defaultConfig {
        applicationId "com.mariaxcodexpert.whatsdownloadplus"
        minSdk 28
        targetSdk 35
        versionCode 16
        versionName "1.0.16"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}
dependencies {
    // --- Core & UI (Modern Android Setup) ---
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.swiperefreshlayout
    implementation libs.activity
    implementation libs.documentfile
    implementation libs.legacy.support.v4

    // --- Navigation Components (Version 2.7.7 for Stability) ---
    def nav_version = "2.7.7"
    implementation "androidx.navigation:navigation-fragment:$nav_version"
    implementation "androidx.navigation:navigation-ui:$nav_version"

    // --- Lifecycle Fix (Resolves version 2.3.1 vs 2.6.2 conflicts) ---
    def lifecycle_version = "2.6.2"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"

    // --- Ads & Consent (UMP) ---
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
    implementation "com.google.android.ump:user-messaging-platform:2.2.0"

    // --- Room Database (Latest Stable) ---
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // --- Media3 (Replacing old ExoPlayer for Video Trimming/Playback) ---
    def media3_version = "1.2.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-transformer:$media3_version"
    implementation "androidx.media3:media3-effect:$media3_version"

    // --- Image Processing (Latest Versions) ---
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    // Professional Cropper (Better than uCrop for modern apps)
    implementation("com.github.CanHub:Android-Image-Cropper:4.5.0")

    // --- Helpers & Utilities ---
    implementation 'com.airbnb.android:lottie:6.3.0'
    implementation 'io.github.chrisbanes:PhotoView:2.3.0'
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.google.android.play:review:2.0.1"
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // --- Testing ---
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}