plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.mariaxcodexpert.whatsdownloadplus'
    compileSdk 35

    defaultConfig {
        applicationId "com.mariaxcodexpert.whatsdownloadplus"
        minSdk 29
        targetSdk 35
        versionCode 24
        versionName "1.0.24"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 🔥 FIX: Pehle property read karo, phir extra quotes remove karke clean string banao
        def rawKey = project.findProperty('API_KEY') ?: ""
        def cleanKey = rawKey.toString().replace("\"", "") // Double quotes saaf kero

        buildConfigField "String", "API_KEY", "\"$cleanKey\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // 🔥 FIX: Host name empty error khatam karne ke liye mapping upload disable karein
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }

            // API KEY Logic (Release)
            def rawKey = project.findProperty('API_KEY') ?: ""
            def cleanKey = rawKey.toString().replace("\"", "")
            buildConfigField "String", "API_KEY", "\"$cleanKey\""
        }

        debug {
            // 🔥 Debug mein Crashlytics band rakhen taake build fast ho
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }

            // API KEY Logic (Debug)
            def rawKey = project.findProperty('API_KEY') ?: ""
            def cleanKey = rawKey.toString().replace("\"", "")
            buildConfigField "String", "API_KEY", "\"$cleanKey\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}
dependencies {
    // --- Core & UI (Modern Android Setup) ---
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.swiperefreshlayout
    implementation libs.activity
    implementation libs.documentfile
    implementation libs.legacy.support.v4
    implementation libs.room3.common.jvm
    implementation libs.gridlayout
    implementation libs.media
    implementation libs.billing
    implementation libs.transport.backend.cct
    testImplementation libs.ext.junit
    testImplementation libs.runner

    // --- Navigation Components (Version 2.7.7) ---
    def nav_version = "2.7.7"
    implementation "androidx.navigation:navigation-fragment:$nav_version"
    implementation "androidx.navigation:navigation-ui:$nav_version"
    androidTestImplementation "androidx.navigation:navigation-testing:$nav_version"

    // --- Lifecycle (Stable Version) ---
    def lifecycle_version = "2.6.2"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"

    // --- Ads & Consent (UMP) ---
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
    implementation "com.google.android.ump:user-messaging-platform:2.2.0"

    // --- Room Database ---
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // --- Media3 (Video Playback & Editing) ---
    def media3_version = "1.2.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-transformer:$media3_version"
    implementation "androidx.media3:media3-effect:$media3_version"
    implementation "androidx.media3:media3-extractor:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"

    // --- Image Processing ---
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation("com.github.CanHub:Android-Image-Cropper:4.5.0")
    implementation ("com.github.bumptech.glide:recyclerview-integration:4.16.0") {
        transitive = false
    }

    // --- Helpers & Utilities ---
    implementation 'com.airbnb.android:lottie:6.3.0' // 🔥 Kept only latest version
    implementation 'io.github.chrisbanes:PhotoView:2.3.0'
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.google.android.play:review:2.0.1"
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // --- Testing ---
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.espresso.contrib
    androidTestImplementation libs.rules
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'

    // --- Firebase & Crashlytics (UPDATED FOR PRODUCTION) ---
    // BoM version 34.12.0 is highly stable for production
    implementation platform('com.google.firebase:firebase-bom:34.12.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics' // ✅ Added for Crash Tracking

    // --- Miscellaneous ---
    implementation 'androidx.concurrent:concurrent-futures:1.2.0'
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation "com.android.billingclient:billing:7.0.0"

    implementation "com.google.firebase:firebase-database"
}