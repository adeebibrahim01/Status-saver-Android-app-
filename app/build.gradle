plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.mariaxcodexpert.whatsdownloadplus'
    compileSdk 35

    defaultConfig {
        applicationId "com.mariaxcodexpert.whatsdownloadplus"
        minSdk 29 // 24 is better for wider device support (Android 7.0+)
        targetSdk 35
        versionCode 16
        versionName "1.0.16"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // Performance & Security Optimization
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Debugging symbols remove karne ke liye (APK size kam hogi)
            ndk {
                debugSymbolLevel 'none'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    // Performance: Avoid compressing specific files to speed up app loading
    aaptOptions {
        noCompress "tflite", "lite"
    }
}

dependencies {
    // --- AndroidX & UI Core ---
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.swiperefreshlayout
    implementation libs.activity
    implementation libs.documentfile
    implementation libs.legacy.support.v4

    // --- Lifecycle & Navigation ---
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.process
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    // --- Ads & Consent (UMP) ---
    // Latest Stable Google Ads SDK
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation "com.google.android.ump:user-messaging-platform:2.2.0"

    // --- Room Database (Fast Storage) ---
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // --- Image & Video Processing ---
    // Glide (Upgraded to 4.16.0 for better performance)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // ExoPlayer (Stable 2.19.1)
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'

    // UCrop (Image Cropping)
    implementation 'com.github.yalantis:ucrop:2.2.8'

    // UI Helpers
    implementation 'com.airbnb.android:lottie:6.3.0'
    implementation 'io.github.chrisbanes:PhotoView:2.3.0'

    // --- Play Store Services ---
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.google.android.play:review:2.0.1"

    // Background Tasks (Optimized for battery)
    implementation "androidx.work:work-runtime:2.9.0"
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    // --- Testing ---
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}