plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.mariaxcodexpert.whatsdownloadplus'
    compileSdk 35

    defaultConfig {
        applicationId "com.mariaxcodexpert.whatsdownloadplus"
        minSdk 29
        targetSdk 35
        versionCode 8
        versionName "1.0.8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // AndroidX & UI
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.swiperefreshlayout
    implementation libs.activity
    implementation libs.documentfile

    // Lifecycle
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx

    // Navigation
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.play.services.ads.api

    // Room
    def room_version = "2.6.0"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Glide & UI
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
    implementation 'com.airbnb.android:lottie:6.1.0'
    implementation 'io.github.chrisbanes:PhotoView:2.3.0'

    // ExoPlayer
    implementation 'com.google.android.exoplayer:exoplayer:2.19.0'

    // Image cropping
    implementation 'com.github.yalantis:ucrop:2.2.8'

    // Google Ads SDK (Stable, supports AdMob + AdManager)
//    implementation 'com.google.android.gms:play-services-ads:23.5.0'

    // Optional: AdMobAdapter for Non-Personalized Ads (NPA)
    // Only needed for consent-based non-personalized ads
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'

    // Consent form (UMP)
    implementation "com.google.android.ump:user-messaging-platform:4.0.0"

    // In-App Updates & Review
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.google.android.play:review:2.0.1"

}
