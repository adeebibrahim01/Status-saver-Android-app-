plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.mariaxcodexpert.whatsdownloadplus'
    compileSdk 35

    defaultConfig {
        applicationId "com.mariaxcodexpert.whatsdownloadplus"
        minSdk 28
        targetSdk 35
        versionCode 16
        versionName "1.0.16"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            ndk {
                debugSymbolLevel 'none'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    aaptOptions {
        noCompress "tflite", "lite"
    }
}

dependencies {
    // --- Splash Screen API (FIX: Isse theme error khatam ho jayega) ---
    implementation "androidx.core:core-splashscreen:1.0.1"

    // --- AndroidX & UI Core ---
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.swiperefreshlayout
    implementation libs.activity
    implementation libs.documentfile
    implementation libs.legacy.support.v4

    // --- Lifecycle & Navigation ---
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.process
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    // --- Ads & Consent (UMP) ---
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation "com.google.android.ump:user-messaging-platform:2.2.0"

    // --- Room Database ---
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // --- Image & Video Processing ---
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.github.yalantis:ucrop:2.2.8'

    // --- UI Helpers ---
    implementation 'com.airbnb.android:lottie:6.3.0'
    implementation 'io.github.chrisbanes:PhotoView:2.3.0'

    // --- Play Store Services ---
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.google.android.play:review:2.0.1"

    // --- Background Tasks ---
    implementation "androidx.work:work-runtime:2.9.0"

    // --- Testing ---
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}